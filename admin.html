<script>


/* =====================================================
   SECURITY
===================================================== */

let currentAdmin = null;

let selectedConversationId = null;

let adminChatChannel = null;


/*
  Check Supabase client
*/

if(
  typeof supabaseClient === "undefined" ||
  !supabaseClient
){

  document.getElementById("loginMessage").innerHTML =
    '<div class="error">Supabase connection is not available.</div>';

}


/* =====================================================
   AUTH CHECK
===================================================== */

async function checkAdminSession(){

  try{

    const {
      data:{
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if(!session){

      showLogin();

      return;

    }


    /*
      IMPORTANT:
      Admin permission is checked from
      Supabase user app_metadata.

      It must contain:

      {
        "role": "admin"
      }

      This cannot safely be controlled from
      normal frontend user metadata.
    */


    const user =
      session.user;


    const role =
      user?.app_metadata?.role;


    if(role !== "admin"){

      await supabaseClient
        .auth
        .signOut();


      showLogin(
        "You are not authorized to access the admin panel."
      );


      return;

    }


    currentAdmin =
      user;


    showAdmin();


  }catch(error){

    console.error(
      "Session check error:",
      error
    );


    showLogin(
      "Could not verify your login."
    );

  }

}


/* =====================================================
   LOGIN
===================================================== */

async function loginAdmin(event){

  event.preventDefault();


  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("loginPassword")
      .value;


  const button =
    document.getElementById("loginButton");


  const message =
    document.getElementById("loginMessage");


  button.disabled =
    true;


  button.textContent =
    "Logging in...";


  message.innerHTML =
    "";


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({

          email:
            email,

          password:
            password

        });


    if(error){

      throw error;

    }


    const role =
      data?.user?.app_metadata?.role;


    if(role !== "admin"){

      await supabaseClient
        .auth
        .signOut();


      throw new Error(
        "This account does not have admin permission."
      );

    }


    currentAdmin =
      data.user;


    showAdmin();


  }catch(error){

    console.error(
      "Login error:",
      error
    );


    message.innerHTML =
      '<div class="error">' +
      escapeHTML(
        error.message ||
        "Login failed."
      ) +
      '</div>';


  }finally{

    button.disabled =
      false;

    button.textContent =
      "🔐 Login";

  }

}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(message=""){

  document
    .getElementById("adminPage")
    .classList
    .add("hidden");


  document
    .getElementById("loginPage")
    .classList
    .remove("hidden");


  if(message){

    document.getElementById("loginMessage").innerHTML =
      '<div class="error">' +
      escapeHTML(message) +
      '</div>';

  }

}


/* =====================================================
   SHOW ADMIN
===================================================== */

function showAdmin(){

  document
    .getElementById("loginPage")
    .classList
    .add("hidden");


  document
    .getElementById("adminPage")
    .classList
    .remove("hidden");


  document.getElementById("adminEmail").textContent =
    currentAdmin?.email || "";


  loadAdminProducts();

}


/* =====================================================
   LOGOUT
===================================================== */

async function logoutAdmin(){

  try{

    await supabaseClient
      .auth
      .signOut();

  }catch(error){

    console.error(error);

  }


  currentAdmin =
    null;


  selectedConversationId =
    null;


  if(adminChatChannel){

    supabaseClient.removeChannel(
      adminChatChannel
    );

    adminChatChannel =
      null;

  }


  showLogin();


  document.getElementById("loginPassword").value =
    "";

}


/* =====================================================
   AUTH STATE LISTENER
===================================================== */

supabaseClient
  .auth
  .onAuthStateChange(
    function(event,session){

      if(event === "SIGNED_OUT"){

        showLogin();

      }

    }
  );


/* =====================================================
   TABS
===================================================== */

function showTab(tabId,button){

  document
    .querySelectorAll(".tab-btn")
    .forEach(btn =>
      btn.classList.remove("active")
    );


  button.classList.add("active");


  [
    "productsTab",
    "ordersTab",
    "chatTab"
  ].forEach(id=>{

    document
      .getElementById(id)
      .classList
      .add("hidden");

  });


  document
    .getElementById(tabId)
    .classList
    .remove("hidden");


  if(tabId === "ordersTab"){

    loadOrders();

  }


  if(tabId === "chatTab"){

    loadChatCustomers();

  }

}


/* =====================================================
   PRODUCTS
===================================================== */

async function loadAdminProducts(){

  const container =
    document.getElementById("productsTable");


  container.innerHTML =
    '<div class="empty">Loading products...</div>';


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    renderAdminProducts(
      data || []
    );


  }catch(error){

    console.error(error);


    container.innerHTML =
      '<div class="empty">' +
      escapeHTML(error.message) +
      '</div>';

  }

}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderAdminProducts(list){

  const container =
    document.getElementById("productsTable");


  if(!list.length){

    container.innerHTML =
      '<div class="empty">No products found.</div>';

    return;

  }


  container.innerHTML = `

    <table>

      <thead>

        <tr>

          <th>Image</th>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Sale</th>
          <th>Stock</th>
          <th>Published</th>
          <th>Actions</th>

        </tr>

      </thead>


      <tbody>

        ${
          list.map(product=>`

            <tr>

              <td>

                <img
                  class="product-thumb"
                  src="${escapeHTML(
                    product.image_url || ""
                  )}"
                  onerror="
                    this.src='https://via.placeholder.com/100?text=No+Image'
                  "
                >

              </td>


              <td>
                ${escapeHTML(product.name || "")}
              </td>


              <td>
                ${escapeHTML(product.category || "")}

                ${
                  product.subcategory
                  ? "<br><small>" +
                    escapeHTML(
                      product.subcategory
                    ) +
                    "</small>"
                  : ""
                }

              </td>


              <td>
                ৳${formatNumber(product.price)}
              </td>


              <td>

                ${
                  product.sale_price != null
                  ? "৳" +

/* =====================================================
   SAVE PRODUCT
===================================================== */

async function saveProduct(event){

  event.preventDefault();


  const id =
    document.getElementById("productId").value;


  const product = {

    name:
      document
        .getElementById("productName")
        .value
        .trim(),

    category:
      document
        .getElementById("productCategory")
        .value,

    subcategory:
      document
        .getElementById("productSubcategory")
        .value
        .trim() || null,

    price:
      Number(
        document
          .getElementById("productPrice")
          .value
      ),

    sale_price:
      document
        .getElementById("productSalePrice")
        .value
        ? Number(
            document
              .getElementById("productSalePrice")
              .value
          )
        : null,

    stock:
      Number(
        document
          .getElementById("productStock")
          .value
      ),

    sizes:
      document
        .getElementById("productSizes")
        .value
        .trim() || null,

    colors:
      document
        .getElementById("productColors")
        .value
        .trim() || null,

    image_url:
      document
        .getElementById("productImage")
        .value
        .trim(),

    description:
      document
        .getElementById("productDescription")
        .value
        .trim() || null,

    published:
      document
        .getElementById("productPublished")
        .value === "true"

  };


  const button =
    document.getElementById("saveProductButton");


  button.disabled =
    true;


  button.textContent =
    "Saving...";


  try{

    let result;


    if(id){

      result =
        await supabaseClient
          .from("products")
          .update(product)
          .eq("id",id);

    }else{

      result =
        await supabaseClient
          .from("products")
          .insert([product]);

    }


    if(result.error){

      throw result.error;

    }


    showProductMessage(
      "Product saved successfully.",
      "success"
    );


    resetProductForm();

    loadAdminProducts();


  }catch(error){

    console.error(error);


    showProductMessage(
      error.message ||
      "Could not save product.",
      "error"
    );

  }finally{

    button.disabled =
      false;

    button.textContent =
      "Save Product";

  }

}

}

async function loadChatCustomers(){

  const container =
    document.getElementById("chatCustomers");


  container.innerHTML =
    '<div class="empty">Loading...</div>';


  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("customer_messages")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){

      throw error;

    }


    const conversations = {};


    (data || []).forEach(message=>{

      const id =
        message.conversation_id;


      if(!id){
        return;
      }


      if(!conversations[id]){

        conversations[id] = {

          id:id,

          name:
            message.name ||
            "Customer",

          phone:
            message.phone ||
            "",

          last:
            message.message ||
            "",

          created_at:
            message.created_at

        };

      }

    });


    const list =
      Object.values(conversations);


    if(!list.length){

      container.innerHTML =
        '<div class="empty">No customer chats yet.</div>';

      return;

    }


    container.innerHTML =
      list.map(customer=>`

        <div
          class="
            chat-customer
            ${
              selectedConversationId === customer.id
              ? "active"
              : ""
            }
          "
          onclick="
            selectConversation(
              '${escapeJS(customer.id)}',
              '${escapeJS(customer.name)}',
              '${escapeJS(customer.phone)}'
            )
          "
        >

          <div class="chat-customer-name">
            ${escapeHTML(customer.name)}
          </div>

          <div class="chat-customer-phone">
            ${escapeHTML(customer.phone)}
          </div>

          <div
            style="
              margin-top:6px;
              color:#64748b;
              font-size:11px;
            "
          >
            ${escapeHTML(customer.last)}
          </div>

        </div>

      `).join("");


  }catch(error){

    console.error(error);


    container.innerHTML =
      '<div class="empty">' +
      escapeHTML(error.message) +
      '</div>';

  }

}

function renderAdminChat(messages){

async function sendAdminMessage(){

  if(!selectedConversationId){

  }


  const input =

    );


  const button =
    document.getElementById(

  try{

      error
    } =

        .from("customer_messages")
        .insert([{

          sender:
            "admin",

          name:
            "Reich Admin",

          message:
            message,

          status:
            "Read"

        }]);


    if(error){

      throw error;

    }


    input.value =

    );

      false;

    button.disabled =
      false;

    input.focus();

  }

}


/* =====================================================
   ADMIN CHAT REALTIME
===================================================== */

function subscribeAdminChat(){

  if(adminChatChannel){

    supabaseClient.removeChannel(
      adminChatChannel
    );

    adminChatChannel =
      null;

  }


  if(!selectedConversationId){

    return;

  }


  adminChatChannel =
    supabaseClient
      .channel(
        "reich-admin-chat-" +
        selectedConversationId
      )
      .on(
        "postgres_changes",
        {
          event:"*",
          schema:"public",
          table:"customer_messages",
          filter:
            "conversation_id=eq." +
            selectedConversationId
        },
        function(){

          loadAdminChatMessages();

        }
      )
      .subscribe();

}

/* =====================================================
   HELPERS
===================================================== */

function formatNumber(value){

  const number =
    Number(value);


  if(!Number.isFinite(number)){

    return "0";

  }


  return number.toLocaleString("en-US");

}


function formatDate(value){

  if(!value){

    return "";

  }


  try{

    return new Date(value)
      .toLocaleString(
        "en-BD",
        {
          dateStyle:"short",
          timeStyle:"short"
        }
      );

  }catch(error){

    return "";

  }

}


function escapeHTML(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


function escapeJS(value){

  return String(value ?? "")

    .replace(/\\/g,"\\\\")

    .replace(/'/g,"\\'")

    .replace(/\r/g,"\\r")

    .replace(/\n/g,"\\n");

}
