<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Reich | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f8fafc;
  color:#111827;
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

header{
  background:#111827;
  color:#fff;
  padding:16px 20px;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

header h1{
  margin:0;
  font-size:24px;
}

.header-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

.view-store,
.logout{
  color:#fff;
  text-decoration:none;
  padding:10px 14px;
  border-radius:8px;
  font-weight:700;
  border:0;
}

.view-store{
  background:#e11d48;
}

.logout{
  background:#475569;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:22px;
  margin-bottom:25px;
}

.card h2{
  margin-top:0;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:8px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#e11d48;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:8px;
}

.checkbox input{
  width:auto;
}

.btn{
  background:#e11d48;
  color:#fff;
  border:0;
  padding:12px 18px;
  border-radius:8px;
  font-weight:700;
}

.btn:hover{
  opacity:.9;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  padding:10px 12px;
  background:#f1f5f9;
  border-radius:8px;
  margin-bottom:15px;
  font-size:14px;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.product-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.product-card{
  border:1px solid #e5e7eb;
  border-radius:12px;
  overflow:hidden;
  background:#fff;
}

.product-card img{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#e5e7eb;
}

.product-info{
  padding:14px;
}

.product-info h3{
  margin:0 0 7px;
}

.meta{
  color:#64748b;
  font-size:13px;
  margin:5px 0;
}

.price{
  font-weight:800;
  font-size:18px;
  margin:8px 0;
}

.old{
  text-decoration:line-through;
  color:#64748b;
  font-size:13px;
  margin-left:6px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.edit{
  background:#111827;
}

.delete{
  background:#dc2626;
}

.empty{
  padding:35px;
  text-align:center;
  background:#f8fafc;
  border-radius:10px;
  color:#64748b;
}

.image-preview{
  margin-top:10px;
  width:180px;
  height:120px;
  object-fit:cover;
  border-radius:8px;
  display:none;
  border:1px solid #e5e7eb;
}

.file-box{
  border:2px dashed #cbd5e1;
  padding:18px;
  border-radius:10px;
  background:#f8fafc;
}

.file-box input{
  background:white;
}

.upload-status{
  margin-top:8px;
  font-size:13px;
  color:#64748b;
}

/* LOGIN */

.login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#f8fafc;
}

.login-box{
  width:min(420px,100%);
  background:#fff;
  padding:30px;
  border-radius:16px;
  border:1px solid #e5e7eb;
  box-shadow:0 10px 30px #0001;
}

.login-box h1{
  margin-top:0;
  text-align:center;
}

.login-box p{
  text-align:center;
  color:#64748b;
}

.login-box label{
  margin-top:15px;
}

.login-btn{
  width:100%;
  margin-top:20px;
}

#adminApp{
  display:none;
}

@media(max-width:800px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .product-list{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:550px){

  .product-list{
    grid-template-columns:1fr;
  }

  .header-inner{
    flex-direction:column;
    align-items:flex-start;
  }

  .header-actions{
    width:100%;
    flex-wrap:wrap;
  }

  .view-store,
  .logout{
    flex:1;
    text-align:center;
  }

}
</style>
</head>

<body>


<!-- =========================
     LOGIN SCREEN
========================= -->

<div id="loginScreen" class="login-screen">

  <div class="login-box">

    <h1>🔐 Reich Admin</h1>

    <p>Sign in to manage your store</p>

    <div id="loginStatus" class="status">
      Please login.
    </div>

    <form id="loginForm">

      <label>Email</label>

      <input
        id="loginEmail"
        type="email"
        required
        placeholder="Admin email"
      >

      <label>Password</label>

      <input
        id="loginPassword"
        type="password"
        required
        placeholder="Admin password"
      >

      <button
        class="btn login-btn"
        id="loginBtn"
        type="submit"
      >
        Login
      </button>

    </form>

  </div>

</div>


<!-- =========================
     ADMIN APP
========================= -->

<div id="adminApp">

<header>

  <div class="header-inner">

    <h1>Reich Admin</h1>

    <div class="header-actions">

      <a
        class="view-store"
        href="index.html"
        target="_blank"
      >
        View Store
      </a>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </div>

</header>


<div class="container">


<!-- =========================
     ADD PRODUCT
========================= -->

<div class="card">

  <h2>Add Product</h2>

  <div id="status" class="status">
    Ready
  </div>

  <form id="productForm">

    <div class="form-grid">

      <div>

        <label>Product Name *</label>

        <input
          id="name"
          type="text"
          required
          placeholder="Premium T-Shirt"
        >

      </div>


      <div>

        <label>Category *</label>

        <select id="category" required>

          <option value="">
            Select Category
          </option>

          <option value="Clothing">
            Clothing
          </option>

          <option value="Electronics">
            Electronics
          </option>

          <option value="Shoes">
            Shoes
          </option>

          <option value="Men">
            Men
          </option>

          <option value="Women">
            Women
          </option>

        </select>

      </div>


      <div>

        <label>Subcategory *</label>

        <input
          id="subcategory"
          type="text"
          required
          placeholder="T-Shirt"
        >

      </div>


      <div>

        <label>Price *</label>

        <input
          id="price"
          type="number"
          min="0"
          step="0.01"
          required
          placeholder="799"
        >

      </div>


      <div>

        <label>Sale Price</label>

        <input
          id="sale_price"
          type="number"
          min="0"
          step="0.01"
          placeholder="599"
        >

      </div>


      <div>

        <label>Stock *</label>

        <input
          id="stock"
          type="number"
          min="0"
          value="0"
          required
        >

      </div>


      <div>

        <label>Sizes</label>

        <input
          id="sizes"
          type="text"
          placeholder="S, M, L, XL"
        >

      </div>


      <div>

        <label>Colors</label>

        <input
          id="colors"
          type="text"
          placeholder="Black, White, Red"
        >

      </div>


      <div class="full">

        <label>Description</label>

        <textarea
          id="description"
          placeholder="Product description..."
        ></textarea>

      </div>


      <!-- PC IMAGE UPLOAD -->

      <div class="full">

        <label>Product Image</label>

        <div class="file-box">

          <input
            id="imageFile"
            type="file"
            accept="image/*"
          >

          <div
            id="uploadStatus"
            class="upload-status"
          >
            Choose an image from your PC.
          </div>

          <img
            id="imagePreview"
            class="image-preview"
            alt="Image Preview"
          >

        </div>

      </div>


      <div>

        <label class="checkbox">

          <input
            id="published"
            type="checkbox"
            checked
          >

          Published

        </label>

      </div>

    </div>


    <br>

    <button
      class="btn"
      id="submitBtn"
      type="submit"
    >
      Add Product
    </button>

  </form>

</div>


<!-- =========================
     PRODUCTS
========================= -->

<div class="card">

  <h2>Products</h2>

  <div
    id="productsList"
    class="product-list"
  >

    <div class="empty">
      Loading products...
    </div>

  </div>

</div>

</div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let editingId = null;
let selectedImageFile = null;


/* =========================
   LOGIN STATUS
========================= */

function showLoginStatus(message,type=""){

  const box =
    document.getElementById("loginStatus");

  box.textContent = message;

  box.className =
    "status " + type;

}


/* =========================
   ADMIN STATUS
========================= */

function showStatus(message,type=""){

  const box =
    document.getElementById("status");

  box.textContent = message;

  box.className =
    "status " + type;

}


/* =========================
   LOGIN
========================= */

document
  .getElementById("loginForm")
  .addEventListener("submit",async function(event){

    event.preventDefault();

    const button =
      document.getElementById("loginBtn");

    const email =
      document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
      document
        .getElementById("loginPassword")
        .value;

    button.disabled=true;

    button.textContent="Logging in...";

    showLoginStatus("Signing in...");


    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
      });


    if(error){

      console.error(error);

      showLoginStatus(
        "Login failed: " + error.message,
        "error"
      );

      button.disabled=false;

      button.textContent="Login";

      return;
    }


    showLoginStatus(
      "Login successful!",
      "success"
    );


    button.disabled=false;

    button.textContent="Login";


    await checkAuth();

});


/* =========================
   CHECK AUTH
========================= */

async function checkAuth(){

  const { data } =
    await supabaseClient.auth.getSession();


  const session =
    data.session;


  if(session){

    document
      .getElementById("loginScreen")
      .style.display="none";

    document
      .getElementById("adminApp")
      .style.display="block";

    loadProducts();

  }else{

    document
      .getElementById("loginScreen")
      .style.display="flex";

    document
      .getElementById("adminApp")
      .style.display="none";

  }

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


/* =========================
   AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
  function(){

    checkAuth();

  }
);


/* =========================
   IMAGE SELECT
========================= */

document
  .getElementById("imageFile")
  .addEventListener("change",function(){

    const file =
      this.files[0];

    const preview =
      document.getElementById("imagePreview");

    const uploadStatus =
      document.getElementById("uploadStatus");


    if(!file){

      selectedImageFile=null;

      preview.style.display="none";

      uploadStatus.textContent =
        "Choose an image from your PC.";

      return;
    }


    if(!file.type.startsWith("image/")){

      alert("Please select an image file.");

      this.value="";

      return;
    }


    if(file.size > 5 * 1024 * 1024){

      alert("Image must be smaller than 5MB.");

      this.value="";

      return;
    }


    selectedImageFile=file;


    preview.src =
      URL.createObjectURL(file);

    preview.style.display="block";


    uploadStatus.textContent =
      "Selected: " + file.name;

  });


/* =========================
   UPLOAD IMAGE
========================= */

async function uploadImage(file){

  if(!file) return null;


  const fileExtension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    Date.now() +
    "-" +
    crypto.randomUUID() +
    "." +
    fileExtension;


  const filePath =
    fileName;


  const { error } =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(
        filePath,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


  if(error){

    throw error;

  }


  const { data } =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(filePath);


  return data.publicUrl;

}


/* =========================
   ADD / UPDATE PRODUCT
========================= */

document
  .getElementById("productForm")
  .addEventListener("submit",async function(event){

    event.preventDefault();


    const button =
      document.getElementById("submitBtn");

    const uploadStatus =
      document.getElementById("uploadStatus");


    button.disabled=true;


    try{

      let imageUrl = null;


      /*
        If editing and no new image selected,
        keep the old image.
      */

      if(editingId){

        const { data:oldProduct } =
          await supabaseClient
            .from("products")
            .select("image_url")
            .eq("id",editingId)
            .single();


        imageUrl =
          oldProduct?.image_url || null;

      }


      /*
        Upload new image if selected
      */

      if(selectedImageFile){

        uploadStatus.textContent =
          "Uploading image...";


        imageUrl =
          await uploadImage(
            selectedImageFile
          );


        uploadStatus.textContent =
          "✅ Image uploaded successfully.";

      }


      const product = {

        name:
          document
            .getElementById("name")
            .value
            .trim(),

        category:
          document
            .getElementById("category")
            .value,

        subcategory:
          document
            .getElementById("subcategory")
            .value
            .trim(),

        price:
          Number(
            document
              .getElementById("price")
              .value
          ),

        sale_price:
          document
            .getElementById("sale_price")
            .value
            ? Number(
                document
                  .getElementById("sale_price")
                  .value
              )
            : null,

        sizes:
          document
            .getElementById("sizes")
            .value
            .trim() || null,

        colors:
          document
            .getElementById("colors")
            .value
            .trim() || null,

        stock:
          Number(
            document
              .getElementById("stock")
              .value
          ),

        description:
          document
            .getElementById("description")
            .value
            .trim() || null,

        image_url:
          imageUrl,

        published:
          document
            .getElementById("published")
            .checked

      };


      let result;


      if(editingId){

        result =
          await supabaseClient
            .from("products")
            .update(product)
            .eq("id",editingId);

      }else{

        result =
          await supabaseClient
            .from("products")
            .insert([product]);

      }


      if(result.error){

        throw result.error;

      }


      showStatus(
        editingId
        ? "✅ Product updated successfully!"
        : "✅ Product added successfully!",
        "success"
      );


      resetForm();

      await loadProducts();

    }catch(error){

      console.error(error);

      showStatus(
        "Error: " + error.message,
        "error"
      );

    }finally{

      button.disabled=false;

    }

});


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const container =
    document.getElementById("productsList");


  container.innerHTML = `
    <div class="empty">
      Loading products...
    </div>
  `;


  const { data,error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        Could not load products.
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    return;
  }


  if(!data || data.length===0){

    container.innerHTML = `
      <div class="empty">
        No products yet.
      </div>
    `;

    return;
  }


  container.innerHTML =
    data.map(product => {

      const price =
        product.sale_price != null
        ? product.sale_price
        : product.price;


      const image =
        product.image_url ||
        "https://via.placeholder.com/800x500?text=No+Image";


      return `

        <div class="product-card">

          <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(product.name)}"
            onerror="this.src='https://via.placeholder.com/800x500?text=No+Image'"
          >

          <div class="product-info">

            <h3>
              ${escapeHTML(product.name)}
            </h3>

            <div class="meta">
              ${escapeHTML(product.category)}
              ${
                product.subcategory
                ? " • " +
                  escapeHTML(product.subcategory)
                : ""
              }
            </div>

            <div class="price">

              ৳${price}

              ${
                product.sale_price != null
                ? `
                  <span class="old">
                    ৳${product.price}
                  </span>
                `
                : ""
              }

            </div>

            <div class="meta">
              Stock: ${product.stock}
            </div>

            <div class="meta">

              ${
                product.published
                ? "✅ Published"
                : "❌ Hidden"
              }

            </div>


            <div class="actions">

              <button
                class="btn edit"
                onclick="editProduct('${product.id}')"
              >
                Edit
              </button>

              <button
                class="btn delete"
                onclick="deleteProduct('${product.id}')"
              >
                Delete
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   EDIT PRODUCT
========================= */

async function editProduct(id){

  const { data,error } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("id",id)
      .single();


  if(error){

    alert(error.message);

    return;
  }


  editingId=id;


  document.getElementById("name").value =
    data.name || "";

  document.getElementById("category").value =
    data.category || "";

  document.getElementById("subcategory").value =
    data.subcategory || "";

  document.getElementById("price").value =
    data.price ?? "";

  document.getElementById("sale_price").value =
    data.sale_price ?? "";

  document.getElementById("sizes").value =
    data.sizes || "";

  document.getElementById("colors").value =
    data.colors || "";

  document.getElementById("stock").value =
    data.stock ?? 0;

  document.getElementById("description").value =
    data.description || "";

  document.getElementById("published").checked =
    data.published;


  selectedImageFile=null;

  document.getElementById("imageFile").value="";


  const preview =
    document.getElementById("imagePreview");


  if(data.image_url){

    preview.src=data.image_url;

    preview.style.display="block";

    document.getElementById("uploadStatus").textContent =
      "Current image. Choose a new file to replace it.";

  }else{

    preview.style.display="none";

    document.getElementById("uploadStatus").textContent =
      "No current image. Choose one from your PC.";

  }


  document.getElementById("submitBtn").textContent =
    "Update Product";


  showStatus(
    "Editing: " + data.name
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

  const confirmed =
    confirm(
      "Are you sure you want to delete this product?"
    );


  if(!confirmed) return;


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      "Delete failed: " +
      error.message
    );

    return;
  }


  showStatus(
    "✅ Product deleted successfully!",
    "success"
  );


  loadProducts();

}


/* =========================
   RESET FORM
========================= */

function resetForm(){

  editingId=null;

  selectedImageFile=null;


  document
    .getElementById("productForm")
    .reset();


  document.getElementById("published").checked =
    true;


  document.getElementById("submitBtn").textContent =
    "Add Product";


  document.getElementById("imagePreview").style.display =
    "none";


  document.getElementById("uploadStatus").textContent =
    "Choose an image from your PC.";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

checkAuth();

</script>

</body>
</html>
