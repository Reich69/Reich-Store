<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Reich | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f8fafc;
  color:#111827;
}

header{
  background:#111827;
  color:#fff;
  padding:16px 20px;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

header h1{
  margin:0;
  font-size:24px;
}

.view-store{
  background:#e11d48;
  color:#fff;
  text-decoration:none;
  padding:10px 14px;
  border-radius:8px;
  font-weight:700;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:22px;
  margin-bottom:25px;
}

.card h2{
  margin-top:0;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:8px;
  outline:none;
  font-family:inherit;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#e11d48;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:8px;
}

.checkbox input{
  width:auto;
}

.btn{
  background:#e11d48;
  color:#fff;
  border:0;
  padding:12px 18px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
}

.btn:hover{
  opacity:.9;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  padding:10px 12px;
  background:#f1f5f9;
  border-radius:8px;
  margin-bottom:15px;
  font-size:14px;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.product-list{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.product-card{
  border:1px solid #e5e7eb;
  border-radius:12px;
  overflow:hidden;
  background:#fff;
}

.product-card img{
  width:100%;
  height:190px;
  object-fit:cover;
  background:#e5e7eb;
}

.product-info{
  padding:14px;
}

.product-info h3{
  margin:0 0 7px;
}

.meta{
  color:#64748b;
  font-size:13px;
  margin:5px 0;
}

.price{
  font-weight:800;
  font-size:18px;
  margin:8px 0;
}

.old{
  text-decoration:line-through;
  color:#64748b;
  font-size:13px;
  margin-left:6px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.delete{
  background:#dc2626;
}

.edit{
  background:#111827;
}

.empty{
  padding:35px;
  text-align:center;
  background:#f8fafc;
  border-radius:10px;
  color:#64748b;
}

.image-preview{
  margin-top:10px;
  width:150px;
  height:100px;
  object-fit:cover;
  border-radius:8px;
  display:none;
}

@media(max-width:800px){

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .product-list{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:550px){

  .product-list{
    grid-template-columns:1fr;
  }

  .header-inner{
    flex-direction:column;
    align-items:flex-start;
  }

}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <h1>Reich Admin</h1>

    <a
      class="view-store"
      href="index.html"
      target="_blank"
    >
      View Store
    </a>

  </div>
</header>


<div class="container">

  <!-- ADD PRODUCT -->

  <div class="card">

    <h2>Add Product</h2>

    <div id="status" class="status">
      Ready
    </div>

    <form id="productForm">

      <div class="form-grid">

        <div>
          <label>Product Name *</label>

          <input
            id="name"
            type="text"
            required
            placeholder="Premium T-Shirt"
          >
        </div>


        <div>
          <label>Category *</label>

          <select id="category" required>

            <option value="">
              Select Category
            </option>

            <option value="Clothing">
              Clothing
            </option>

            <option value="Electronics">
              Electronics
            </option>

            <option value="Shoes">
              Shoes
            </option>

            <option value="Men">
              Men
            </option>

            <option value="Women">
              Women
            </option>

          </select>
        </div>


        <div>
          <label>Subcategory *</label>

          <input
            id="subcategory"
            type="text"
            required
            placeholder="T-Shirt"
          >
        </div>


        <div>
          <label>Price *</label>

          <input
            id="price"
            type="number"
            min="0"
            step="0.01"
            required
            placeholder="799"
          >
        </div>


        <div>
          <label>Sale Price</label>

          <input
            id="sale_price"
            type="number"
            min="0"
            step="0.01"
            placeholder="599"
          >
        </div>


        <div>
          <label>Stock *</label>

          <input
            id="stock"
            type="number"
            min="0"
            value="0"
            required
          >
        </div>


        <div>
          <label>Sizes</label>

          <input
            id="sizes"
            type="text"
            placeholder="S, M, L, XL"
          >
        </div>


        <div>
          <label>Colors</label>

          <input
            id="colors"
            type="text"
            placeholder="Black, White, Red"
          >
        </div>


        <div class="full">

          <label>Description</label>

          <textarea
            id="description"
            placeholder="Product description..."
          ></textarea>

        </div>


        <div class="full">

          <label>Image URL</label>

          <input
            id="image_url"
            type="url"
            placeholder="https://..."
          >

          <img
            id="imagePreview"
            class="image-preview"
            alt="Preview"
          >

        </div>


        <div>

          <label class="checkbox">

            <input
              id="published"
              type="checkbox"
              checked
            >

            Published

          </label>

        </div>

      </div>


      <br>

      <button
        class="btn"
        id="submitBtn"
        type="submit"
      >
        Add Product
      </button>

    </form>

  </div>


  <!-- PRODUCTS -->

  <div class="card">

    <h2>Products</h2>

    <div
      id="productsList"
      class="product-list"
    >

      <div class="empty">
        Loading products...
      </div>

    </div>

  </div>

</div>


<script>

/* =========================
   VARIABLES
========================= */

let editingId = null;


/* =========================
   STATUS
========================= */

function showStatus(message,type=""){

  const status =
    document.getElementById("status");

  status.textContent = message;

  status.className =
    "status " + type;

}


/* =========================
   IMAGE PREVIEW
========================= */

document
  .getElementById("image_url")
  .addEventListener("input",function(){

    const url = this.value.trim();

    const preview =
      document.getElementById("imagePreview");

    if(!url){

      preview.style.display="none";

      return;
    }

    preview.src=url;

    preview.style.display="block";

  });


/* =========================
   ADD / UPDATE PRODUCT
========================= */

document
  .getElementById("productForm")
  .addEventListener("submit",async function(event){

    event.preventDefault();


    const button =
      document.getElementById("submitBtn");

    button.disabled=true;


    const product = {

      name:
        document
          .getElementById("name")
          .value
          .trim(),

      category:
        document
          .getElementById("category")
          .value,

      subcategory:
        document
          .getElementById("subcategory")
          .value
          .trim(),

      price:
        Number(
          document
            .getElementById("price")
            .value
        ),

      sale_price:
        document
          .getElementById("sale_price")
          .value
          ? Number(
              document
                .getElementById("sale_price")
                .value
            )
          : null,

      sizes:
        document
          .getElementById("sizes")
          .value
          .trim() || null,

      colors:
        document
          .getElementById("colors")
          .value
          .trim() || null,

      stock:
        Number(
          document
            .getElementById("stock")
            .value
        ),

      description:
        document
          .getElementById("description")
          .value
          .trim() || null,

      image_url:
        document
          .getElementById("image_url")
          .value
          .trim() || null,

      published:
        document
          .getElementById("published")
          .checked

    };


    try{

      let result;


      if(editingId){

        result =
          await supabaseClient
            .from("products")
            .update(product)
            .eq("id",editingId);

      }else{

        result =
          await supabaseClient
            .from("products")
            .insert([product]);

      }


      if(result.error){

        console.error(result.error);

        showStatus(
          "Error: " + result.error.message,
          "error"
        );

        return;
      }


      showStatus(
        editingId
        ? "✅ Product updated successfully!"
        : "✅ Product added successfully!",
        "success"
      );


      resetForm();

      await loadProducts();

    }finally{

      button.disabled=false;

    }

});


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

  const container =
    document.getElementById("productsList");


  const { data,error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("created_at",{ascending:false});


  if(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        Could not load products.
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    return;
  }


  if(!data || data.length===0){

    container.innerHTML = `
      <div class="empty">
        No products yet.
      </div>
    `;

    return;
  }


  container.innerHTML =
    data.map(product => {

      const price =
        product.sale_price != null
        ? product.sale_price
        : product.price;


      const image =
        product.image_url ||
        "https://via.placeholder.com/800x500?text=No+Image";


      return `

        <div class="product-card">

          <img
            src="${escapeHTML(image)}"
            alt="${escapeHTML(product.name)}"
            onerror="this.src='https://via.placeholder.com/800x500?text=No+Image'"
          >

          <div class="product-info">

            <h3>
              ${escapeHTML(product.name)}
            </h3>

            <div class="meta">
              ${escapeHTML(product.category)}
              ${
                product.subcategory
                ? " • " +
                  escapeHTML(product.subcategory)
                : ""
              }
            </div>

            <div class="price">

              ৳${price}

              ${
                product.sale_price != null
                ? `
                  <span class="old">
                    ৳${product.price}
                  </span>
                `
                : ""
              }

            </div>

            <div class="meta">
              Stock: ${product.stock}
            </div>

            <div class="meta">

              ${
                product.published
                ? "✅ Published"
                : "❌ Hidden"
              }

            </div>


            <div class="actions">

              <button
                class="btn edit"
                onclick="editProduct('${product.id}')"
              >
                Edit
              </button>

              <button
                class="btn delete"
                onclick="deleteProduct('${product.id}')"
              >
                Delete
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   EDIT PRODUCT
========================= */

async function editProduct(id){

  const { data,error } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("id",id)
      .single();


  if(error){

    alert(error.message);

    return;
  }


  editingId=id;


  document.getElementById("name").value =
    data.name || "";

  document.getElementById("category").value =
    data.category || "";

  document.getElementById("subcategory").value =
    data.subcategory || "";

  document.getElementById("price").value =
    data.price ?? "";

  document.getElementById("sale_price").value =
    data.sale_price ?? "";

  document.getElementById("sizes").value =
    data.sizes || "";

  document.getElementById("colors").value =
    data.colors || "";

  document.getElementById("stock").value =
    data.stock ?? 0;

  document.getElementById("description").value =
    data.description || "";

  document.getElementById("image_url").value =
    data.image_url || "";

  document.getElementById("published").checked =
    data.published;


  document.getElementById("submitBtn").textContent =
    "Update Product";


  showStatus(
    "Editing: " + data.name
  );


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });


  const preview =
    document.getElementById("imagePreview");


  if(data.image_url){

    preview.src=data.image_url;

    preview.style.display="block";

  }else{

    preview.style.display="none";

  }

}


/* =========================
   DELETE PRODUCT
========================= */

async function deleteProduct(id){

  const confirmed =
    confirm(
      "Are you sure you want to delete this product?"
    );


  if(!confirmed) return;


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      "Delete failed: " +
      error.message
    );

    return;
  }


  showStatus(
    "✅ Product deleted successfully!",
    "success"
  );


  loadProducts();

}


/* =========================
   RESET FORM
========================= */

function resetForm(){

  editingId=null;

  document
    .getElementById("productForm")
    .reset();


  document.getElementById("published").checked =
    true;


  document.getElementById("submitBtn").textContent =
    "Add Product";


  document.getElementById("imagePreview").style.display =
    "none";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadProducts();

</script>

</body>
</html>
