<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Reich | Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#111827;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.6;
}


/* HEADER */

header{
  background:#111827;
  color:#fff;
  position:sticky;
  top:0;
  z-index:20;
}

.header-inner{
  max-width:1400px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.logo span{
  color:#e11d48;
}

.admin-title{
  color:#cbd5e1;
  font-size:14px;
}


/* CONTAINER */

.container{
  max-width:1400px;
  margin:30px auto;
  padding:0 20px;
}


/* CARDS */

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:22px;
  margin-bottom:25px;
}

.card h2{
  margin-top:0;
}


/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:20px;
}

.stat-title{
  color:#64748b;
  font-size:13px;
  margin-bottom:8px;
}

.stat-number{
  font-size:28px;
  font-weight:800;
}


/* FORM */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.form-group{
  margin-bottom:5px;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

input,
textarea,
select{
  width:100%;
  padding:11px 12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  outline:none;
  background:#fff;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#e11d48;
}

textarea{
  min-height:100px;
  resize:vertical;
}


/* BUTTONS */

.btn{
  border:0;
  background:#e11d48;
  color:#fff;
  padding:11px 16px;
  border-radius:8px;
  font-weight:700;
}

.btn:hover{
  opacity:.9;
}

.btn-dark{
  background:#111827;
}

.btn-green{
  background:#16a34a;
}

.btn-red{
  background:#dc2626;
}

.btn-gray{
  background:#64748b;
}


/* FORM ACTIONS */

.form-actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

#cancelEditBtn{
  display:none;
}


/* STATUS */

.status{
  display:none;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  font-size:14px;
  font-weight:600;
}

.status.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.status.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}


/* PRODUCTS */

.product-toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:18px;
}

.search{
  max-width:300px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:950px;
}

th,
td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
  font-size:13px;
  vertical-align:middle;
}

th{
  background:#f8fafc;
  font-size:12px;
  text-transform:uppercase;
  color:#64748b;
}

.product-img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:8px;
  background:#e5e7eb;
}

.product-name{
  font-weight:700;
}

.muted{
  color:#64748b;
  font-size:12px;
}


/* BADGES */

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
}

.badge-green{
  background:#dcfce7;
  color:#166534;
}

.badge-red{
  background:#fee2e2;
  color:#991b1b;
}

.badge-yellow{
  background:#fef3c7;
  color:#92400e;
}


/* ACTIONS */

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.small-btn{
  border:0;
  padding:7px 9px;
  border-radius:6px;
  color:#fff;
  font-size:11px;
  font-weight:700;
}


/* LOADING */

.loading{
  text-align:center;
  padding:35px;
  color:#64748b;
}


/* ORDERS */

.order-status{
  padding:6px 9px;
  border-radius:6px;
  border:1px solid #cbd5e1;
  font-size:12px;
}


/* MOBILE */

@media(max-width:900px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

  .product-toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .search{
    max-width:none;
  }

}

@media(max-width:550px){

  .container{
    padding:0 12px;
    margin-top:20px;
  }

  .header-inner{
    padding:13px 15px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat{
    padding:15px;
  }

  .stat-number{
    font-size:22px;
  }

  .form-actions{
    flex-direction:column;
  }

}

</style>

</head>

<body>

<header>

<div class="header-inner">

<div>

<div class="logo">
Reich<span>.</span>
</div>

<div class="admin-title">
Admin Panel
</div>

</div>

<a
href="index.html"
target="_blank"
class="btn btn-dark"

>

View Store </a>

</div>

</header>

<main class="container">

<!-- STATS -->

<div class="stats">

<div class="stat">

<div class="stat-title">
Total Products
</div>

<div
class="stat-number"
id="totalProducts"
>
0
</div>

</div>

<div class="stat">

<div class="stat-title">
Published
</div>

<div
class="stat-number"
id="publishedProducts"
>
0
</div>

</div>

<div class="stat">

<div class="stat-title">
Out of Stock
</div>

<div
class="stat-number"
id="outStockProducts"
>
0
</div>

</div>

<div class="stat">

<div class="stat-title">
Total Orders
</div>

<div
class="stat-number"
id="totalOrders"
>
0
</div>

</div>

</div>

<!-- PRODUCT FORM -->

<div class="card">

<h2 id="formTitle">
➕ Add New Product
</h2>

<div
id="status"
class="status"
>
</div>

<form
id="productForm"
onsubmit="saveProduct(event)"
>

<div class="form-grid">

<div class="form-group">

<label>
Product Name *
</label>

<input
id="productName"
type="text"
placeholder="Example: Premium T-Shirt"
required

>

</div>

<div class="form-group">

<label>
Category *
</label>

<select
id="productCategory"
required

>

<option value="">
Select Category
</option>

<option value="Clothing">
Clothing
</option>

<option value="Electronics">
Electronics
</option>

<option value="Shoes">
Shoes
</option>

<option value="Men">
Men
</option>

<option value="Women">
Women
</option>

</select>

</div>

<div class="form-group">

<label>
Subcategory
</label>

<input
id="productSubcategory"
type="text"
placeholder="Example: T-Shirts"

>

</div>

<div class="form-group">

<label>
Price *
</label>

<input
id="productPrice"
type="number"
min="0"
step="0.01"
placeholder="Example: 1200"
required

>

</div>

<div class="form-group">

<label>
Sale Price
</label>

<input
id="productSalePrice"
type="number"
min="0"
step="0.01"
placeholder="Optional"

>

</div>

<div class="form-group">

<label>
Stock *
</label>

<input
id="productStock"
type="number"
min="0"
value="0"
required

>

</div>

<div class="form-group">

<label>
Sizes
</label>

<input
id="productSizes"
type="text"
placeholder="S, M, L, XL"

>

<div class="muted">
Separate sizes with comma.
</div>

</div>

<div class="form-group">

<label>
Colors
</label>

<input
id="productColors"
type="text"
placeholder="Black, White, Red"

>

<div class="muted">
Separate colors with comma.
</div>

</div>

<div class="form-group full">

<label>
Product Image URL
</label>

<input
id="productImage"
type="url"
placeholder="https://..."

>

<div class="muted">
Paste the direct image URL here.
</div>

</div>

<div class="form-group full">

<label>
Description
</label>

<textarea
id="productDescription"
placeholder="Write product details..."
></textarea>

</div>

<div class="form-group">

<label>
Published
</label>

<select
id="productPublished"

>

<option value="true">
Yes — Show on website
</option>

<option value="false">
No — Hide from website
</option>

</select>

</div>

</div>

<div class="form-actions">

<button
class="btn"
type="submit"
id="saveBtn"

>

➕ Add Product </button>

<button
class="btn btn-gray"
type="button"
id="cancelEditBtn"
onclick="cancelEdit()"

>

Cancel Edit </button>

</div>

</form>

</div>

<!-- PRODUCTS -->

<div class="card">

<div class="product-toolbar">

<h2 style="margin:0">
📦 Products
</h2>

<input
class="search"
id="productSearch"
placeholder="Search products..."
oninput="renderProducts()"

>

</div>

<div
id="productsTable"
class="table-wrap"
>

<div class="loading">
Loading products...
</div>

</div>

</div>

<!-- ORDERS -->

<div class="card">

<div class="product-toolbar">

<h2 style="margin:0">
🛍️ Orders
</h2>

<button
class="btn btn-dark"
onclick="loadOrders()"

>

↻ Refresh </button>

</div>

<div
id="ordersTable"
class="table-wrap"
>

<div class="loading">
Loading orders...
</div>

</div>

</div>

</main>

<script>


/* ================================
   VARIABLES
================================ */

let products = [];

let editingProductId = null;


/* ================================
   SUPABASE CHECK
================================ */

function checkSupabase(){

  if(
    typeof supabaseClient === "undefined" ||
    !supabaseClient
  ){

    throw new Error(
      "Supabase client is not available. Check supabase.js"
    );

  }

}


/* ================================
   STATUS
================================ */

function showStatus(message,type){

  const box =
    document.getElementById("status");

  box.textContent =
    message;

  box.className =
    "status " + type;

}


/* ================================
   LOAD PRODUCTS
================================ */

async function loadProducts(){

  const table =
    document.getElementById("productsTable");

  table.innerHTML = `
    <div class="loading">
      Loading products...
    </div>
  `;


  try{

    checkSupabase();


    const {data,error} =
      await supabaseClient
        .from("products")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(error){
      throw error;
    }


    products =
      data || [];


    updateStats();

    renderProducts();


  }catch(error){

    console.error(
      "Products loading error:",
      error
    );


    table.innerHTML = `
      <div class="loading">
        Could not load products.<br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

  }

}


/* ================================
   STATS
================================ */

async function updateStats(){

  const total =
    products.length;


  const published =
    products.filter(
      product =>
        product.published === true
    ).length;


  const outStock =
    products.filter(
      product =>
        Number(product.stock || 0) <= 0
    ).length;


  document.getElementById(
    "totalProducts"
  ).textContent =
    total;


  document.getElementById(
    "publishedProducts"
  ).textContent =
    published;


  document.getElementById(
    "outStockProducts"
  ).textContent =
    outStock;


  try{

    const {count,error} =
      await supabaseClient
        .from("orders")
        .select(
          "*",
          {
            count:"exact",
            head:true
          }
        );


    if(!error){

      document.getElementById(
        "totalOrders"
      ).textContent =
        count || 0;

    }

  }catch(error){

    console.error(error);

  }

}


/* ================================
   RENDER PRODUCTS
================================ */

function renderProducts(){

  const container =
    document.getElementById(
      "productsTable"
    );


  const search =
    (
      document.getElementById(
        "productSearch"
      ).value || ""
    )
      .toLowerCase()
      .trim();


  const list =
    products.filter(product=>{

      return (

        String(
          product.name || ""
        )
          .toLowerCase()
          .includes(search)

        ||

        String(
          product.category || ""
        )
          .toLowerCase()
          .includes(search)

        ||

        String(
          product.subcategory || ""
        )
          .toLowerCase()
          .includes(search)

      );

    });


  if(list.length === 0){

    container.innerHTML = `
      <div class="loading">
        No products found.
      </div>
    `;

    return;

  }


  container.innerHTML = `

    <table>

      <thead>

        <tr>

          <th>Image</th>
          <th>Product</th>
          <th>Category</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Published</th>
          <th>Actions</th>

        </tr>

      </thead>


      <tbody>

        ${
          list.map(product=>{

            const price =
              product.sale_price != null
              ? Number(product.sale_price)
              : Number(product.price);


            const image =
              product.image_url ||
              "https://via.placeholder.com/100";


            return `

              <tr>

                <td>

                  <img
                    class="product-img"
                    src="${escapeHTML(image)}"
                    onerror="this.src='https://via.placeholder.com/100'"
                    alt=""
                  >

                </td>


                <td>

                  <div class="product-name">
                    ${escapeHTML(
                      product.name || "Product"
                    )}
                  </div>

                  ${
                    product.description

                    ? `

                      <div class="muted">
                        ${escapeHTML(
                          product.description
                        ).slice(0,70)}
                      </div>

                    `

                    : ""
                  }

                </td>


                <td>

                  ${escapeHTML(
                    product.category || "-"
                  )}

                  ${
                    product.subcategory

                    ? `

                      <div class="muted">
                        ${escapeHTML(
                          product.subcategory
                        )}
                      </div>

                    `

                    : ""
                  }

                </td>


                <td>

                  <strong>
                    ৳${formatNumber(price)}
                  </strong>


                  ${
                    product.sale_price != null

                    ? `

                      <div class="muted">
                        <s>
                          ৳${formatNumber(
                            product.price
                          )}
                        </s>
                      </div>

                    `

                    : ""
                  }

                </td>


                <td>

                  ${
                    Number(product.stock || 0) > 0

                    ? `

                      <span class="badge badge-green">
                        ${product.stock}
                      </span>

                    `

                    : `

                      <span class="badge badge-red">
                        Out
                      </span>

                    `
                  }

                </td>


                <td>

                  ${
                    product.published

                    ? `

                      <span class="badge badge-green">
                        Published
                      </span>

                    `

                    : `

                      <span class="badge badge-yellow">
                        Hidden
                      </span>

                    `
                  }

                </td>


                <td>

                  <div class="actions">


                    <button
                      class="small-btn"
                      style="background:#111827"
                      onclick="editProduct('${escapeJS(product.id)}')"
                    >
                      Edit
                    </button>


                    <button
                      class="small-btn"
                      style="background:#16a34a"
                      onclick="togglePublished('${escapeJS(product.id)}')"
                    >
                      ${
                        product.published
                        ? "Hide"
                        : "Publish"
                      }
                    </button>


                    <button
                      class="small-btn"
                      style="background:#dc2626"
                      onclick="deleteProduct('${escapeJS(product.id)}')"
                    >
                      Delete
                    </button>


                  </div>

                </td>

              </tr>

            `;

          }).join("")
        }

      </tbody>

    </table>

  `;

}


/* ================================
   SAVE PRODUCT
================================ */

async function saveProduct(event){

  event.preventDefault();


  const button =
    document.getElementById(
      "saveBtn"
    );


  button.disabled =
    true;


  button.textContent =
    editingProductId
    ? "Updating..."
    : "Adding...";


  try{

    checkSupabase();


    const productData = {

      name:
        document
          .getElementById(
            "productName"
          )
          .value
          .trim(),

      category:
        document
          .getElementById(
            "productCategory"
          )
          .value,

      subcategory:
        document
          .getElementById(
            "productSubcategory"
          )
          .value
          .trim() || null,

      price:
        Number(
          document
            .getElementById(
              "productPrice"
            )
            .value
        ),

      sale_price:
        document
          .getElementById(
            "productSalePrice"
          )
          .value
          ? Number(
              document
                .getElementById(
                  "productSalePrice"
                )
                .value
            )
          : null,

      stock:
        Number(
          document
            .getElementById(
              "productStock"
            )
            .value
        ),

      sizes:
        document
          .getElementById(
            "productSizes"
          )
          .value
          .trim() || null,

      colors:
        document
          .getElementById(
            "productColors"
          )
          .value
          .trim() || null,

      image_url:
        document
          .getElementById(
            "productImage"
          )
          .value
          .trim() || null,

      description:
        document
          .getElementById(
            "productDescription"
          )
          .value
          .trim() || null,

      published:
        document
          .getElementById(
            "productPublished"
          )
          .value === "true"

    };


    let result;


    if(editingProductId){

      result =
        await supabaseClient
          .from("products")
          .update(productData)
          .eq(
            "id",
            editingProductId
          );

    }else{

      result =
        await supabaseClient
          .from("products")
          .insert([
            productData
          ]);

    }


    if(result.error){

      throw result.error;

    }


    showStatus(

      editingProductId

      ? "✅ Product updated successfully!"

      : "✅ Product added successfully!",

      "success"

    );


    resetForm();


    await loadProducts();


  }catch(error){

    console.error(
      "Save product error:",
      error
    );


    showStatus(
      "❌ " + error.message,
      "error"
    );

  }


  button.disabled =
    false;


  button.textContent =
    editingProductId
    ? "Update Product"
    : "➕ Add Product";

}


/* ================================
   EDIT PRODUCT
================================ */

function editProduct(productId){

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(productId)
    );


  if(!product){
    return;
  }


  editingProductId =
    product.id;


  document.getElementById(
    "formTitle"
  ).textContent =
    "✏️ Edit Product";


  document.getElementById(
    "productName"
  ).value =
    product.name || "";


  document.getElementById(
    "productCategory"
  ).value =
    product.category || "";


  document.getElementById(
    "productSubcategory"
  ).value =
    product.subcategory || "";


  document.getElementById(
    "productPrice"
  ).value =
    product.price ?? "";


  document.getElementById(
    "productSalePrice"
  ).value =
    product.sale_price ?? "";


  document.getElementById(
    "productStock"
  ).value =
    product.stock ?? 0;


  document.getElementById(
    "productSizes"
  ).value =
    product.sizes || "";


  document.getElementById(
    "productColors"
  ).value =
    product.colors || "";


  document.getElementById(
    "productImage"
  ).value =
    product.image_url || "";


  document.getElementById(
    "productDescription"
  ).value =
    product.description || "";


  document.getElementById(
    "productPublished"
  ).value =
    product.published
    ? "true"
    : "false";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "Update Product";


  document.getElementById(
    "cancelEditBtn"
  ).style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================================
   CANCEL EDIT
================================ */

function cancelEdit(){

  resetForm();

}


/* ================================
   RESET FORM
================================ */

function resetForm(){

  editingProductId =
    null;


  document.getElementById(
    "productForm"
  ).reset();


  document.getElementById(
    "productStock"
  ).value =
    0;


  document.getElementById(
    "formTitle"
  ).textContent =
    "➕ Add New Product";


  document.getElementById(
    "saveBtn"
  ).textContent =
    "➕ Add Product";


  document.getElementById(
    "cancelEditBtn"
  ).style.display =
    "none";

}


/* ================================
   PUBLISH / HIDE
================================ */

async function togglePublished(productId){

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(productId)
    );


  if(!product){
    return;
  }


  try{

    const {error} =
      await supabaseClient
        .from("products")
        .update({

          published:
            !product.published

        })
        .eq(
          "id",
          product.id
        );


    if(error){
      throw error;
    }


    await loadProducts();


  }catch(error){

    console.error(error);

    alert(
      "Could not update product status.\n\n" +
      error.message
    );

  }

}


/* ================================
   DELETE PRODUCT
================================ */

async function deleteProduct(productId){

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(productId)
    );


  if(!product){
    return;
  }


  const confirmed =
    confirm(

      "Are you sure you want to delete:\n\n" +

      product.name +

      "\n\nThis action cannot be undone."

    );


  if(!confirmed){
    return;
  }


  try{

    const {error} =
      await supabaseClient
        .from("products")
        .delete()
        .eq(
          "id",
          product.id
        );


    if(error){
      throw error;
    }


    showStatus(
      "✅ Product deleted successfully.",
      "success"
    );


    await loadProducts();


  }catch(error){

    console.error(
      "Delete error:",
      error
    );


    showStatus(
      "❌ " + error.message,
      "error"
    );

  }

}

/* ================================
   UPDATE ORDER STATUS
================================ */

async function updateOrderStatus(
  orderId,
  status
){

  try{

    const {error} =
      await supabaseClient
        .from("orders")
        .update({
          status:status
        })
        .eq(
          "id",
          orderId
        );


    if(error){
      throw error;
    }


    showStatus(
      "✅ Order status updated.",
      "success"
    );


  }catch(error){

    console.error(error);


    alert(
      "Could not update order status.\n\n" +
      error.message
    );


    loadOrders();

  }

}


/* ================================
   DELETE ORDER
================================ */

async function deleteOrder(orderId){

  if(
    !confirm(
      "Are you sure you want to delete this order?"
    )
  ){

    return;

  }


  try{

    const {error} =
      await supabaseClient
        .from("orders")
        .delete()
        .eq(
          "id",
          orderId
        );


    if(error){
      throw error;
    }


    await loadOrders();

    await updateStats();


  }catch(error){

    console.error(error);


    alert(
      "Could not delete order.\n\n" +
      error.message
    );

  }

}


/* ================================
   HELPERS
================================ */

function formatNumber(value){

  const number =
    Number(value);


  if(!Number.isFinite(number)){
    return "0";
  }


  return number.toLocaleString(
    "en-US"
  );

}


function formatDate(value){

  try{

    return new Date(value)
      .toLocaleString(
        "en-BD",
        {
          dateStyle:"medium",
          timeStyle:"short"
        }
      );

  }catch(error){

    return "";

  }

}


function escapeHTML(value){

  return String(
    value ?? ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeJS(value){

  return String(
    value ?? ""
  )

    .replace(
      /\\/g,
      "\\\\"
    )

    .replace(
      /'/g,
      "\\'"
    )

    .replace(
      /\r/g,
      "\\r"
    )

    .replace(
      /\n/g,
      "\\n"
    );

}
